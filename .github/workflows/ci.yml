name: Rally validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: rally
          POSTGRES_PASSWORD: rally-ci-only
          POSTGRES_DB: rally_ci_admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rally -d rally_ci_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      RALLY_PG_ADMIN_URL: postgresql://rally:rally-ci-only@localhost:5432/rally_ci_admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and validation dependencies
        run: python -m pip install -e '.[test,temporal]'
      - name: Compile Python
        run: python -m compileall -q rally adapters workflows tests
      - name: Check cockpit JavaScript syntax
        run: node --check rally/web/app.js && node --check rally/web/shell.js
      - name: Validate navigable browser DOM
        run: |
          npm install --no-save --ignore-scripts jsdom@26.1.0
          node tests/ui_shell.cjs
          node tests/ui_dataflow.cjs
      - name: Run SQLite and disposable PostgreSQL integration tests
        run: python -m pytest -q
      - name: Verify production configuration rejects placeholders
        run: python -c "from ops.preflight import validate; assert validate({'RALLY_ADMIN_KEY':'weak','POSTGRES_PASSWORD':'weak','RALLY_DOMAIN':'rally.example.com','ACME_EMAIL':'x@example.com'})"
      - name: Validate production Compose
        env:
          RALLY_ADMIN_KEY: "integration-only-abcdefghijklmnopqrstuv1234567890"
          POSTGRES_PASSWORD: rally-ci-only
          RALLY_APP_PASSWORD: rally-ci-independent
          RALLY_DOMAIN: rally.example.com
          ACME_EMAIL: ci@example.com
        run: docker compose -f compose.production.yaml config --quiet
      - name: Build application container
        run: docker build -t rally-ci:latest .
      - name: Boot disposable API and reconciliation worker
        run: bash ops/smoke_local.sh

      - name: Boot isolated production services with restricted PostgreSQL role
        run: bash ops/smoke_production.sh
