[project]
name = "rally"
version = "0.2.0"
description = "Rally — open-source-based business execution assurance"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
temporal = ["temporalio>=1.8,<3", "httpx>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rally*", "adapters*", "workflows*"]
exclude = ["web*", "tests*"]

[tool.setuptools.package-data]
rally = ["web/*.html", "web/*.js", "web/*.css"]
